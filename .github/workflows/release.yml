name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Test and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies --allow-missing-repository

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          files: '*.vsix'
          generate_release_notes: true
          body: |
            ## Installation

            1. Download `terraform-iam-policy-checker-${{ steps.get_version.outputs.VERSION }}.vsix` from the Assets section below
            2. Open VSCode
            3. Press `Ctrl+Shift+P` then type `Extensions: Install from VSIX`
            4. Select the downloaded file
            5. Restart VSCode

            Or via terminal (after downloading the .vsix file, run from the folder containing it):

                code --install-extension terraform-iam-policy-checker-${{ steps.get_version.outputs.VERSION }}.vsix

            See [CHANGELOG.md](https://github.com/KARTIKEYA47JAIN/terraform-iam-policy-checker/blob/main/CHANGELOG.md) for what changed in this version.