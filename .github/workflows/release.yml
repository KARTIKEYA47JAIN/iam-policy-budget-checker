name: Release

# Runs only when you push a tag starting with 'v' — e.g. v1.0.0, v1.1.0
# This is how you trigger a release:
#   git tag v1.1.0
#   git push origin v1.1.0

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Test and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      # 'write' permission needed to create GitHub Releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run tests
        run: npm test
        # Release is blocked if any test fails — never ship broken code

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        # Extracts '1.1.0' from 'refs/tags/v1.1.0'
        # Available as ${{ steps.get_version.outputs.VERSION }}

      - name: Package VSIX
        run: npx vsce package --no-dependencies --allow-missing-repository
        # Creates iam-policy-budget-checker-X.X.X.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          files: '*.vsix'
          generate_release_notes: true
          # generate_release_notes: true auto-generates release notes from
          # commit messages since the last tag — this is why conventional
          # commit messages matter (feat:, fix:, docs: etc.)
          body: |
            ## Installation

            1. Download `iam-policy-budget-checker-${{ steps.get_version.outputs.VERSION }}.vsix` below
            2. Open VSCode
            3. Press `Ctrl+Shift+P` → `Extensions: Install from VSIX`
            4. Select the downloaded file
            5. Restart VSCode

            Or via terminal:
            ```bash
            code --install-extension iam-policy-budget-checker-${{ steps.get_version.outputs.VERSION }}.vsix
            ```

            See [CHANGELOG.md](https://github.com/KARTIKEYA47JAIN/iam-policy-budget-checker/blob/main/CHANGELOG.md) for what changed in this version.